syntax = "proto3";

package maestro_android;

service MaestroDriver {

  rpc deviceInfo(DeviceInfoRequest) returns (DeviceInfo) {}

  rpc viewHierarchy(ViewHierarchyRequest) returns (ViewHierarchyResponse) {}

  rpc screenshot(ScreenshotRequest) returns (ScreenshotResponse) {}

  rpc tap(TapRequest) returns (TapResponse) {}

  rpc inputText(InputTextRequest) returns (InputTextResponse) {}

  rpc eraseAllText(EraseAllTextRequest) returns (EraseAllTextResponse) {}

  rpc setLocation(SetLocationRequest) returns (SetLocationResponse) {}

  rpc isWindowUpdating(CheckWindowUpdatingRequest) returns (CheckWindowUpdatingResponse) {}

  rpc launchApp(LaunchAppRequest) returns (LaunchAppResponse) {}

  rpc addMedia(stream AddMediaRequest) returns (AddMediaResponse) {}

  rpc enableMockLocationProviders(EmptyRequest) returns (EmptyResponse) {}

  rpc disableLocationUpdates(EmptyRequest) returns (EmptyResponse) {}

  // Near-side queries (smithr#1184): resolve a selector ON THE DEVICE instead of shipping the
  // whole hierarchy to the host. A driver without these answers UNIMPLEMENTED, and the host
  // keeps the full-dump path.
  rpc capabilities(CapabilitiesRequest) returns (CapabilitiesResponse) {}

  rpc find(FindRequest) returns (FindResponse) {}

  rpc waitUntil(WaitUntilRequest) returns (WaitUntilResponse) {}
}

message EmptyRequest {}
message EmptyResponse {}

message LaunchAppRequest {

  string packageName = 1;
  repeated ArgumentValue arguments = 2;
}

message ArgumentValue {
  string key = 1;
  string value = 2;
  string type = 3;
}

message LaunchAppResponse {}

// Device info
message DeviceInfoRequest {}

message DeviceInfo {
  uint32 widthPixels = 1;
  uint32 heightPixels = 2;
}

message ScreenshotRequest {}

message ScreenshotResponse {
  bytes bytes = 1;
}

// View hierarchy
message ViewHierarchyRequest {}

message ViewHierarchyResponse {
  string hierarchy = 1;
}

// Interactions

message TapRequest {
  uint32 x = 1;
  uint32 y = 2;
}

message TapResponse {}

message InputTextRequest {
  string text = 1;
}
message InputTextResponse {}


message EraseAllTextRequest {
    uint32 charactersToErase = 1;
}

message EraseAllTextResponse {}

message SetLocationRequest {
    double latitude = 1;
    double longitude = 2;
}

message SetLocationResponse {}

message CheckWindowUpdatingRequest {
  string appId = 1;
}

message CheckWindowUpdatingResponse {
  bool isWindowUpdating = 1;
}

message AddMediaRequest {
  Payload payload = 1;
  string media_name = 2;
  string media_ext = 3;
}

message AddMediaResponse { }

message Payload {
  bytes data = 1;
}

// Near-side queries (smithr#1184)

message CapabilitiesRequest {}

message CapabilitiesResponse {
  uint32 nearSide = 1;
  repeated string ops = 2;
  repeated string selectorFields = 3;
}

// The expressible subset of a Maestro ElementSelector, with the host's semantics.
// Regexes are the patterns the host compiled, applied with Maestro's REGEX_OPTIONS.
message NearSideSelector {
  optional string textRegex = 1;
  optional string idRegex = 2;
  optional bool enabled = 3;
  optional bool selected = 4;
  optional bool checked = 5;
  optional bool focused = 6;
  optional int32 index = 7;
  NearSideSelector below = 8;
  NearSideSelector above = 9;
  NearSideSelector leftOf = 10;
  NearSideSelector rightOf = 11;
}

message FindRequest {
  NearSideSelector selector = 1;
  uint32 limit = 2;
  // The host's DeviceInfo grid, which filterOutOfBounds measures visibility against
  uint32 screenWidth = 3;
  uint32 screenHeight = 4;
}

// One matched node, with the attributes the host would have built for it from the dump
message NearSideElement {
  map<string, string> attributes = 1;
  optional bool clickable = 2;
  optional bool enabled = 3;
  optional bool focused = 4;
  optional bool checked = 5;
  optional bool selected = 6;
}

message FindResponse {
  repeated NearSideElement matches = 1;
  bool truncated = 2;
  uint64 deviceMs = 3;
}

message WaitUntilRequest {
  FindRequest find = 1;
  // "visible" | "gone"
  string condition = 2;
  uint32 timeoutMs = 3;
  uint32 pollMs = 4;
}

message WaitUntilResponse {
  bool ok = 1;
  uint64 elapsedMs = 2;
  // The last evaluation: the matches when ok and the condition is "visible"
  FindResponse last = 3;
}
